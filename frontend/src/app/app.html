<div class="min-h-screen bg-base-200 text-base-content">
  <header class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a routerLink="/" class="btn btn-ghost text-xl font-bold">Tier List Creator</a>
    </div>
    <div class="flex-none items-center gap-2">
      <button
        class="btn btn-ghost btn-circle btn-sm"
        type="button"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="toggleTheme()"
      >
        @if (theme() === 'dark') {
          <!-- sun -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        } @else {
          <!-- moon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>
      @if (user(); as u) {
        <a routerLink="/create" class="btn btn-primary btn-sm">Create</a>
        <div class="flex items-center gap-2">
          @if (u.avatar) {
            <img
              class="w-8 h-8 rounded-full"
              [src]="avatarUrl(u.discord_id, u.avatar)"
              [alt]="u.username"
            />
          }
          <span class="text-sm font-medium hidden sm:inline">{{ u.username }}</span>
          <button class="btn btn-ghost btn-sm" (click)="logout()">Logout</button>
        </div>
      } @else {
        <button class="btn btn-primary btn-sm" (click)="login()">Login with Discord</button>
      }
    </div>
  </header>

  <main class="p-4 max-w-5xl mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>
